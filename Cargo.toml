[package]
name = "dialo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "A small, keyboard-first SIP softphone for Wayland (Hyprland) and X11"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[build-dependencies]
# libre and baresip are compiled from vendor/ (tools/fetch-deps.sh) and linked in statically.
cmake = "0.1"
pkg-config = "0.3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
